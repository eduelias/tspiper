<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tspiper promotional banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E0C"/>
      <stop offset="0.55" stop-color="#0D1712"/>
      <stop offset="1" stop-color="#16281F"/>
    </linearGradient>
    <style>
      .kicker { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4ADE80; letter-spacing: 4px; }
      .title  { font: 700 72px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .sub    { font: 600 32px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #CFE3D8; }
      .bullet { font: 400 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E8F0EB; }
      .footl  { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FAE9E; }
      .footr  { font: 400 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7E8F87; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text class="kicker" x="56" y="80">TYPESCRIPT · LIBRARY</text>

  <!-- decorative pipeline top-right -->
  <g transform="translate(960,60)" stroke="#4ADE80" stroke-width="2.5" fill="none">
    <circle cx="12" cy="30" r="12"/>
    <path d="M24 30 h44" stroke-linecap="round"/>
    <circle cx="92" cy="30" r="12" stroke-opacity="0.7"/>
    <path d="M104 30 h44" stroke-linecap="round" stroke-opacity="0.7"/>
    <circle cx="172" cy="30" r="12" stroke-opacity="0.45"/>
    <path d="M196 22 l14 8 l-14 8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.45"/>
  </g>

  <text class="title" x="52" y="165">tspiper</text>

  <text class="sub" x="56" y="225">A zero-dependency TypeScript pipeline —</text>
  <text class="sub" x="56" y="268">typed pieces, explicit flow control.</text>

  <g fill="#4ADE80">
    <circle cx="66" cy="352" r="7"/>
    <circle cx="66" cy="406" r="7"/>
    <circle cx="66" cy="460" r="7"/>
  </g>
  <text class="bullet" x="92" y="361">Compose typed pieces into an execution pipeline</text>
  <text class="bullet" x="92" y="415">Zero runtime dependencies — nothing to audit but the code</text>
  <text class="bullet" x="92" y="469">A core small enough to read in one sitting, with tests</text>

  <line x1="56" y1="540" x2="1144" y2="540" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <text class="footl" x="56" y="588">TypeScript · zero dependencies</text>
  <text class="footr" x="1144" y="588" text-anchor="end">MIT</text>
</svg>
